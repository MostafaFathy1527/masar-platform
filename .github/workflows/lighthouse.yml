name: Lighthouse

# Performance, accessibility, best practices and SEO, measured on every push
# against a production build of that commit, so a regression is tied to the
# change that caused it. Only pages that render without a database are audited:
# CI has a placeholder connection string and never connects.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: lighthouse-ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        # next/font fetches the Google Fonts CSS at build time, and that fetch
        # has failed on the runner ("Module not found" in the Newsreader CSS,
        # 2 of 4 builds on 24/11, both green on rerun). One retry, with a
        # warning so a real break still shows: a second failure fails the job.
        run: |
          npm run build && exit 0
          echo "::warning::build failed once (likely the Google Fonts fetch); retrying in 20 s"
          sleep 20
          npm run build
      - name: Audit
        run: npx -y @lhci/cli@0.14.0 autorun --config=lighthouserc.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
