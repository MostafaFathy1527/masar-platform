name: Judge panel (weekly)

# Re-scores every sample with the seated judge panel, once a week and on demand:
# three judges on Amazon Bedrock and one open judge behind an OpenAI-compatible
# endpoint. Model providers update their models without notice, and a judge that
# passed calibration last month may not judge the same way today; a sample that
# drops out of PANEL PASS here is the first sign.
#
# No AWS key is stored anywhere. GitHub's OIDC token is exchanged for short-lived
# credentials on an IAM role that may only invoke Bedrock models. Until the
# repository variable AWS_ROLE_ARN is set, the job is skipped rather than failed.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  panel:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt boto3
      # Prints the claims AWS will match the role's trust policy against (never
      # the token itself), so a refused role says why instead of only that.
      - name: Show the OIDC claims AWS will see
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com',
                                       headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          body = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(body + '=' * (-len(body) % 4)))
          for k in ('iss', 'aud', 'sub', 'repository', 'ref'):
              print(f'{k}: {claims.get(k)}')
          print('role:', os.environ.get('ROLE'))
          PY
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # The open seat (SERVED_JUDGES in pipeline/panel.py) is not on Bedrock. It
      # needs a reachable OpenAI-compatible endpoint serving that exact GGUF,
      # Qwen3-30B-A3B-Thinking-2507-Q8_0, on hardware rented for the run. Until
      # the repository secret JUDGE_QWEN3_ENDPOINT is set the seat is empty, and
      # every sample reports NEEDS HUMAN because of it, never PASS.
      - name: Score every sample with the panel
        env:
          JUDGE_QWEN3_ENDPOINT: ${{ secrets.JUDGE_QWEN3_ENDPOINT }}
        run: |
          set +e
          status=0
          echo "## Judge panel, $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          for lesson in pipeline/out/lesson-sec-01/v1 pipeline/out/lesson-cs-01/v1 \
                        pipeline/out/lesson-prv-01/v1 pipeline/out/lesson-ops-01-r2/v2; do
            python pipeline/panel.py --lesson "$lesson/lesson.json" --run > panel.log 2>&1
            code=$?
            out=$(tail -1 panel.log)
            echo "- \`$lesson\`: $out" >> "$GITHUB_STEP_SUMMARY"
            echo "$lesson: $out"
            [ $code -ne 0 ] && status=1
          done
          exit $status
