name: Judge panel (weekly)

# Re-scores every sample with the seated judge panel, once a week and on demand:
# three judges on Amazon Bedrock and one open judge behind an OpenAI-compatible
# endpoint. Model providers update their models without notice, and a judge that
# passed calibration last month may not judge the same way today; a sample that
# drops out of PANEL PASS here is the first sign.
#
# No AWS key is stored anywhere. GitHub's OIDC token is exchanged for short-lived
# credentials on an IAM role that may only invoke Bedrock models. Until the
# repository variable AWS_ROLE_ARN is set, the job is skipped rather than failed.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  panel:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt boto3
      # Prints the claims AWS will match the role's trust policy against (never
      # the token itself), so a refused role says why instead of only that.
      - name: Show the OIDC claims AWS will see
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com',
                                       headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          body = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(body + '=' * (-len(body) % 4)))
          for k in ('iss', 'aud', 'sub', 'repository', 'ref'):
              print(f'{k}: {claims.get(k)}')
          print('role:', os.environ.get('ROLE'))
          PY
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # The open seat (SERVED_JUDGES in pipeline/panel.py) is not on Bedrock. Two
      # V100 cards are rented for the length of the run, the seated GGUF is served
      # there behind an SSH tunnel, and the machine is terminated in the last step
      # whatever happened. The SSH key is made for this run and thrown away with
      # it. Without the CLOUDRIFT_API_KEY secret nothing is rented, the seat stays
      # empty, and every sample reports NEEDS HUMAN, never PASS.
      - name: Rent a GPU and serve the open seat
        env:
          CLOUDRIFT_API_KEY: ${{ secrets.CLOUDRIFT_API_KEY }}
        run: |
          if [ -z "$CLOUDRIFT_API_KEY" ]; then
            echo "CLOUDRIFT_API_KEY is not set; the open seat stays empty"; exit 0
          fi
          ssh-keygen -q -t ed25519 -N '' -f run_key
          ip=$(python pipeline/served_judge_vm.py up --public-key run_key.pub)
          ssh_opts="-i run_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ConnectTimeout=30"
          echo "rented machine at $ip"
          up=0
          for i in $(seq 1 40); do ssh $ssh_opts riftuser@"$ip" true 2>/dev/null && { up=1; break; }; sleep 15; done
          [ $up -eq 1 ] || { echo "no SSH to $ip after 10 minutes"; exit 1; }
          ssh $ssh_opts riftuser@"$ip" 'bash -s' < pipeline/served_judge_setup.sh
          ssh $ssh_opts -fN -L 18080:127.0.0.1:8080 riftuser@"$ip"
          curl -sf http://127.0.0.1:18080/health
          echo "JUDGE_QWEN3_ENDPOINT=http://127.0.0.1:18080/v1" >> "$GITHUB_ENV"
      - name: Score every sample with the panel
        run: |
          set +e
          status=0
          echo "## Judge panel, $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          for lesson in pipeline/out/lesson-sec-01/v1 pipeline/out/lesson-cs-01/v1 \
                        pipeline/out/lesson-prv-01/v1 pipeline/out/lesson-ops-01-r2/v2; do
            python pipeline/panel.py --lesson "$lesson/lesson.json" --run > panel.log 2>&1
            code=$?
            out=$(tail -1 panel.log)
            echo "- \`$lesson\`: $out" >> "$GITHUB_STEP_SUMMARY"
            echo "$lesson: $out"
            [ $code -ne 0 ] && status=1
          done
          exit $status
      # The verdicts and panel reports are kept with the run, so a split can be
      # read judge by judge; they are not committed.
      - name: Keep the verdicts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-verdicts
          path: |
            pipeline/out/lesson-*/v*/verdict.*.json
            pipeline/out/lesson-*/v*/panel-report.md
          if-no-files-found: ignore
          retention-days: 90
      - name: Give the GPU back
        if: always()
        env:
          CLOUDRIFT_API_KEY: ${{ secrets.CLOUDRIFT_API_KEY }}
        run: |
          [ -z "$CLOUDRIFT_API_KEY" ] && exit 0
          python pipeline/served_judge_vm.py down
