name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma validate resolves env('DATABASE_URL') from prisma.config.ts.
      # A syntactically valid placeholder is enough; CI never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next 16 generates route types during the build, so a bare tsc would
      # fail on types that are not checked in. The script runs typegen first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - name: Scan for secrets and leaked local paths
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
