name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma validate resolves env('DATABASE_URL') from prisma.config.ts.
      # A syntactically valid placeholder is enough; CI never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next 16 generates route types during the build, so a bare tsc would
      # fail on types that are not checked in. The script runs typegen first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

  # Proves the committed migrations reproduce the datamodel exactly. The
  # baseline was generated offline with `migrate diff` on a machine that cannot
  # open outbound TCP 5432, so it had never been replayed against a real
  # Postgres. This job is that check, run on every push rather than once.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/masar
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE masar;'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE shadow;'

      # Exit code 2 means the migrations and the schema disagree.
      - name: Migrations must reproduce the datamodel
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      # And they must actually apply to an empty database.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: No drift after apply
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - name: Scan for secrets and leaked local paths
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
