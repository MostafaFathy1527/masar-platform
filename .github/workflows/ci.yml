name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma validate resolves env('DATABASE_URL') from prisma.config.ts.
      # A syntactically valid placeholder is enough; CI never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next 16 generates route types during the build, so a bare tsc would
      # fail on types that are not checked in. The script runs typegen first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

  # Proves the committed migrations reproduce the datamodel exactly. The
  # baseline was generated offline with `migrate diff` on a machine that cannot
  # open outbound TCP 5432, so it had never been replayed against a real
  # Postgres. This job is that check, run on every push rather than once.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/masar
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE masar;'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE shadow;'

      # Exit code 2 means the migrations and the schema disagree.
      - name: Migrations must reproduce the datamodel
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      # And they must actually apply to an empty database.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: No drift after apply
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

  # The content pipeline's own gate. It validates lesson documents against the
  # GENERATED JSON Schema, so this job also proves the TypeScript-to-Python
  # contract still holds. The negative tests run first: a validator that has
  # only ever returned PASS proves nothing.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: pip install -r pipeline/requirements.txt

      # The schema is generated. If it is stale, the contract is a fiction.
      - name: JSON Schema must be up to date with the Zod source
        run: |
          npm run schema:export
          git diff --exit-code -- content/schema/lesson.schema.json

      - name: Validator negative tests
        run: python pipeline/test_validate.py

      - name: Validate authored lesson content
        run: python pipeline/validate.py

  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan history, not just the tip

      # The gitleaks action is not used here. It derives a commit range of the
      # form <first-pushed>^..<last>, which is an invalid revision when the
      # push contains the root commit — it then scans zero bytes and still
      # fails the job. Red for the wrong reason while verifying nothing is
      # worse than no check at all, so the binary is invoked directly.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3

      - name: Scan full history for secrets and leaked local paths
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact -v --exit-code 1
